<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldSheet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8B8"/>
      <stop offset="30%" stop-color="#F5CE58"/>
      <stop offset="70%" stop-color="#D9A82E"/>
      <stop offset="100%" stop-color="#A87B15"/>
    </linearGradient>
    <linearGradient id="goldSheet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#E2B73C"/>
      <stop offset="100%" stop-color="#A87B18"/>
    </linearGradient>
    <linearGradient id="goldSheet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D270"/>
      <stop offset="50%" stop-color="#C79C28"/>
      <stop offset="100%" stop-color="#8F6813"/>
    </linearGradient>
    <filter id="darkGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Emblem: 3 Stacked Legal Documents -->
  <g transform="translate(15, 18)" filter="url(#darkGlow)">
    <g transform="translate(28, 8) rotate(14)">
      <rect x="0" y="0" width="40" height="56" rx="5" fill="url(#goldSheet3)" stroke="#8F6813" stroke-width="1.2"/>
    </g>
    <g transform="translate(14, 4) rotate(6)">
      <rect x="0" y="0" width="40" height="56" rx="5" fill="url(#goldSheet2)" stroke="#A87B18" stroke-width="1.2"/>
      <line x1="8" y1="16" x2="30" y2="16" stroke="#7A580F" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="8" y1="24" x2="30" y2="24" stroke="#7A580F" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
    <g transform="translate(0, 0)">
      <path d="M12 0 H38 C42 0 45 3 45 7 V54 C45 58 42 61 38 61 H6 C2 61 0 58 0 54 V12 L12 0 Z" fill="url(#goldSheet1)" stroke="#9E7618" stroke-width="1.2"/>
      <path d="M0 12 H9 C10.5 12 12 10.5 12 9 V0 L0 12 Z" fill="#FFFCE6" stroke="#9E7618" stroke-width="1"/>
      <rect x="8" y="18" width="26" height="3" rx="1.5" fill="#7A580F"/>
      <rect x="8" y="26" width="26" height="3" rx="1.5" fill="#7A580F"/>
      <rect x="8" y="34" width="26" height="3" rx="1.5" fill="#7A580F"/>
      <rect x="8" y="42" width="16" height="3" rx="1.5" fill="#7A580F"/>
    </g>
  </g>

  <!-- Right Typography: BRASIL LEGAL -->
  <g transform="translate(100, 26)">
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" letter-spacing="1.5" fill="#FFFFFF">BRASIL <tspan fill="#F5CE58">LEGAL</tspan></text>
    <rect x="1" y="42" width="230" height="2" fill="#F5CE58" opacity="0.5"/>
    <text x="2" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="2.5" fill="#94A3B8">CARTÓRIOS &amp; REGISTROS</text>
  </g>
</svg>
