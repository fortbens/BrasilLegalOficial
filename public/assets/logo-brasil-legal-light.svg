<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="30%" stop-color="#E5C04A"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6B12"/>
    </linearGradient>
    <linearGradient id="goldSheet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0B2"/>
      <stop offset="50%" stop-color="#D4AA33"/>
      <stop offset="100%" stop-color="#9B751A"/>
    </linearGradient>
    <linearGradient id="goldSheet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C762"/>
      <stop offset="50%" stop-color="#BA9025"/>
      <stop offset="100%" stop-color="#7B5B11"/>
    </linearGradient>
    <!-- Navy Lettering Gradients with 3D Bevel -->
    <linearGradient id="navyFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343899"/>
      <stop offset="40%" stop-color="#242777"/>
      <stop offset="100%" stop-color="#171950"/>
    </linearGradient>
    <linearGradient id="navySide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1D56"/>
      <stop offset="100%" stop-color="#0E0F2B"/>
    </linearGradient>
    <!-- Gold Ribbon / 3D E -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#E1BA41"/>
      <stop offset="75%" stop-color="#B88A1A"/>
      <stop offset="100%" stop-color="#7A560B"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F102B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ==================== TOP EMBLEM: 3 STACKED GOLD LEGAL DOCUMENTS ==================== -->
  <g transform="translate(145, 12)" filter="url(#subtleShadow)">
    <!-- 3rd Document (Back) -->
    <g transform="translate(38, 12) rotate(14)">
      <rect x="0" y="0" width="54" height="74" rx="8" fill="url(#goldSheet3)" stroke="#7B5B11" stroke-width="1.5"/>
    </g>

    <!-- 2nd Document (Middle) -->
    <g transform="translate(20, 6) rotate(6)">
      <rect x="0" y="0" width="54" height="74" rx="8" fill="url(#goldSheet2)" stroke="#9B751A" stroke-width="1.5"/>
      <!-- Soft Lines -->
      <line x1="12" y1="20" x2="42" y2="20" stroke="#7A580F" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="12" y1="30" x2="42" y2="30" stroke="#7A580F" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- 1st Document (Front) -->
    <g transform="translate(0, 0)">
      <!-- Main Page Body with Folded Top-Left Ear -->
      <path d="M16 0 H52 C56.4 0 60 3.6 60 8 V72 C60 76.4 56.4 80 52 80 H8 C3.6 80 0 76.4 0 72 V16 L16 0 Z" fill="url(#goldTopGrad)" stroke="#8F6B12" stroke-width="1.5"/>
      <!-- Folded Corner Ear -->
      <path d="M0 16 H12 C14.2 16 16 14.2 16 12 V0 L0 16 Z" fill="#FFF8C6" stroke="#9E7618" stroke-width="1"/>
      
      <!-- Embossed Document Clauses (Horizontal Lines) -->
      <rect x="12" y="24" width="36" height="4" rx="2" fill="#7A580F"/>
      <rect x="12" y="34" width="36" height="4" rx="2" fill="#7A580F"/>
      <rect x="12" y="44" width="36" height="4" rx="2" fill="#7A580F"/>
      <rect x="12" y="54" width="24" height="4" rx="2" fill="#7A580F"/>

      <!-- Metallic highlight shine on front document -->
      <path d="M22 4 L56 4 C57 4 58 5 58 6 L58 50 L22 4 Z" fill="#FFFFFF" opacity="0.18"/>
    </g>
  </g>

  <!-- ==================== LINE 1: BRAS!L ==================== -->
  <g transform="translate(20, 115)" filter="url(#subtleShadow)">
    <!-- B -->
    <g transform="translate(5, 0)">
      <!-- 3D Extrusion Depth -->
      <path d="M4 4 H32 C42 4 48 10 48 18 C48 24 44 28 38 31 C46 34 50 40 50 49 C50 60 42 66 30 66 H4 V4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M0 0 H28 C38 0 44 6 44 14 C44 20 40 24 34 27 C42 30 46 36 46 45 C46 56 38 62 26 62 H0 V0 Z M12 11 V22 H24 C28 22 31 20 31 16.5 C31 13 28 11 24 11 H12 Z M12 33 V51 H25 C29.5 51 33 48.5 33 42 C33 35.5 29.5 33 25 33 H12 Z" fill="url(#navyFront)"/>
      <!-- Stencil Cutout Slash -->
      <rect x="-2" y="26" width="34" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- R -->
    <g transform="translate(68, 0)">
      <!-- 3D Extrusion Depth -->
      <path d="M4 4 H32 C42 4 48 10 48 20 C48 28 42 33 34 35 L50 66 H36 L22 36 H16 V66 H4 V4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M0 0 H28 C38 0 44 6 44 16 C44 24 38 29 30 31 L46 62 H32 L18 32 H12 V62 H0 V0 Z M12 11 V22 H24 C28 22 31 19.5 31 16.5 C31 13.5 28 11 24 11 H12 Z" fill="url(#navyFront)"/>
      <!-- Stencil Notch -->
      <rect x="22" y="25" width="22" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- A -->
    <g transform="translate(130, 0)">
      <!-- 3D Extrusion Depth -->
      <path d="M26 4 L4 66 H17 L22 52 H38 L43 66 H56 L34 4 H26 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M22 0 L0 62 H13 L18 48 H34 L39 62 H52 L30 0 H22 Z M26 15 L31 37 H21 L26 15 Z" fill="url(#navyFront)"/>
      <!-- Stencil Slash -->
      <rect x="14" y="32" width="26" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- S -->
    <g transform="translate(194, 0)">
      <!-- 3D Extrusion Depth -->
      <path d="M14 4 C24 4 44 6 44 20 C44 32 30 35 24 38 C18 41 16 44 16 48 C16 54 22 57 32 57 C40 57 48 54 48 54 L52 65 C52 65 42 68 30 68 C16 68 4 62 4 48 C4 35 18 32 26 29 C32 26 34 23 34 19 C34 14 28 12 20 12 C12 12 5 15 5 15 L1 4 C1 4 10 4 14 4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M10 0 C20 0 40 2 40 16 C40 28 26 31 20 34 C14 37 12 40 12 44 C12 50 18 53 28 53 C36 53 44 50 44 50 L48 61 C48 61 38 64 26 64 C12 64 0 58 0 44 C0 31 14 28 22 25 C28 22 30 19 30 15 C30 10 24 8 16 8 C8 8 1 11 1 11 L-3 0 C-3 0 6 0 10 0 Z" fill="url(#navyFront)"/>
      <!-- Stencil Cutouts -->
      <rect x="10" y="24" width="28" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- ! (GOLD EXCLAMATION MARK IN PLACE OF I) -->
    <g transform="translate(254, -3)">
      <!-- 3D Side Depth for Exclamation Mark -->
      <path d="M6 3 L18 3 L14 45 L8 45 Z" fill="#8F6B12"/>
      <circle cx="13" cy="56" r="6.5" fill="#8F6B12"/>
      <!-- Front Face Gold ! -->
      <path d="M2 0 L14 0 L11 41 L5 41 Z" fill="url(#goldTopGrad)" stroke="#B88A1A" stroke-width="0.8"/>
      <!-- Exclamation Point Gold Dot -->
      <circle cx="8" cy="53" r="6" fill="url(#goldTopGrad)" stroke="#B88A1A" stroke-width="0.8"/>
      <!-- Gleam / Specular Shine -->
      <line x1="5" y1="4" x2="11" y2="4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="6.5" cy="51" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- L -->
    <g transform="translate(284, 0)">
      <!-- 3D Extrusion Depth -->
      <path d="M4 4 H16 V54 H44 V66 H4 V4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M0 0 H12 V50 H40 V62 H0 V0 Z" fill="url(#navyFront)"/>
      <!-- Chamfer Notch -->
      <rect x="6" y="20" width="10" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- ==================== LINE 2: LEGAL ==================== -->
  <g transform="translate(20, 182)" filter="url(#subtleShadow)">
    <!-- L -->
    <g transform="translate(5, 0)">
      <!-- 3D Side -->
      <path d="M4 4 H16 V50 H44 V62 H4 V4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M0 0 H12 V46 H40 V58 H0 V0 Z" fill="url(#navyFront)"/>
    </g>

    <!-- E (ICONIC GOLDEN 3D STYLIZED CHEVRON/RIBBON) -->
    <g transform="translate(56, 12)">
      <!-- 3D Under-layer Shadow -->
      <path d="M6 26 L24 4 L48 4 L30 26 H48 L32 44 L54 44 L36 62 H4 L22 44 H4 L18 26 Z" fill="#6B4F0B" opacity="0.7"/>
      <!-- Middle Segment (Bottom Tier) -->
      <path d="M0 48 L22 26 H46 L24 48 Z" fill="url(#goldRibbon)" stroke="#7A560B" stroke-width="1"/>
      <!-- Middle Tier -->
      <path d="M8 36 L30 14 H54 L32 36 Z" fill="url(#goldSheet2)" stroke="#8F6B12" stroke-width="1"/>
      <!-- Top Tier -->
      <path d="M16 24 L38 2 H62 L40 24 Z" fill="url(#goldTopGrad)" stroke="#B88A1A" stroke-width="1"/>
      <!-- Bottom Chevron Hook (Isometric E Base) -->
      <path d="M2 48 L18 48 L34 32 L20 32 Z" fill="#D4AA33"/>
      <!-- Metallic Highlights on E -->
      <line x1="18" y1="4" x2="36" y2="4" stroke="#FFF7C2" stroke-width="2"/>
    </g>

    <!-- G -->
    <g transform="translate(136, 0)">
      <!-- 3D Side -->
      <path d="M38 4 C20 4 6 18 6 35 C6 52 20 66 38 66 C50 66 58 58 58 58 V35 H32 V46 H46 V53 C46 53 42 56 37 56 C25 56 18 48 18 35 C18 22 25 14 37 14 C46 14 52 18 52 18 L56 6 C56 6 48 4 38 4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M34 0 C16 0 2 14 2 31 C2 48 16 62 34 62 C46 62 54 54 54 54 V31 H28 V42 H42 V49 C42 49 38 52 33 52 C21 52 14 44 14 31 C14 18 21 10 33 10 C42 10 48 14 48 14 L52 2 C52 2 44 0 34 0 Z" fill="url(#navyFront)"/>
    </g>

    <!-- A -->
    <g transform="translate(202, 0)">
      <!-- 3D Side -->
      <path d="M26 4 L4 62 H17 L22 48 H38 L43 62 H56 L34 4 H26 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M22 0 L0 58 H13 L18 44 H34 L39 58 H52 L30 0 H22 Z M26 14 L31 34 H21 L26 14 Z" fill="url(#navyFront)"/>
      <!-- Stencil Notch -->
      <rect x="14" y="28" width="26" height="3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- L -->
    <g transform="translate(266, 0)">
      <!-- 3D Side -->
      <path d="M4 4 H16 V50 H44 V62 H4 V4 Z" fill="url(#navySide)"/>
      <!-- Front Face -->
      <path d="M0 0 H12 V46 H40 V58 H0 V0 Z" fill="url(#navyFront)"/>
    </g>
  </g>
</svg>
